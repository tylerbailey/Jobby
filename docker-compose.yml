services:
  scraper:
    build:
      context: ./Jobby.Scraper
      dockerfile: Dockerfile
    ports:
      - "8081:8080"

  api:
    build:
      context: .
      dockerfile: Jobby.Server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Scraper__BaseUrl: http://scraper:8080
    depends_on:
      - scraper
